name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with Ubunutu System Gradle & Make Wrapper
      run: |
        export MAVEN_REPO=https://repo1.maven.org/maven2/
        # Sử dụng trọn bộ build tool tự động không cần tạo wrapper thủ công
        find . -maxdepth 2 -name "build.gradle" -o -name "build.gradle.kts"
        
        # Cài đặt Gradle trực tiếp qua SDKMAN hoặc dùng lệnh dự phòng
        apt-get update && apt-get install -y wget unzip
        wget https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip gradle-8.5-bin.zip
        export PATH=$PWD/gradle-8.5/bin:$PATH
        
        gradle assembleRelease || ./gradlew assembleRelease

    - uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
