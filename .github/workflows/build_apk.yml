name: Build Android Floating APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK with Gradle
      run: |
        chmod +x gradlew || true
        # Tự động cấp phép license Android SDK để Gradle tự build mượt mà
        mkdir -p android-sdk/licenses
        echo "24333f1a91d69192f1536b39de5522960f585d68" > android-sdk/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131964887" >> android-sdk/licenses/android-sdk-license
        export ANDROID_HOME=$PWD/android-sdk
        
        ./gradlew assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
