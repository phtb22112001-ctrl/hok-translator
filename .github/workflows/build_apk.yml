name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with Android Build Action
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: default
        arch: x86_6
        disable-animations: true
        script: ./gradlew assembleRelease || gradle assembleRelease

    - name: Fallback Build
      if: failure()
      run: |
        # Tự sinh gradle wrapper nếu thiếu
        gradle wrapper
        ./gradlew assembleRelease

    - uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
