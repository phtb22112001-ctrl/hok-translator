name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle and Build
      run: |
        # Cài đặt trực tiếp Gradle trên Ubuntu runner
        sudo apt-get update && sudo apt-get install -y gradle
        
        # Cấp phép Android SDK cơ bản để không bị chặn license
        mkdir -p $HOME/android-sdk/licenses
        echo "24333f1a91d69192f1536b39de5522960f585d68" > $HOME/android-sdk/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131964887" >> $HOME/android-sdk/licenses/android-sdk-license
        export ANDROID_HOME=$HOME/android-sdk

        # Gọi lệnh gradle trực tiếp không cần dùng gradlew
        gradle assembleRelease

    - uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
